></div><div class="question-text" id="questionText"></div><div class="options review-options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next-question" id="nextButton" type="button" onclick="nextQuestion()">下一题 →</button></section><nav class="lesson-navigation"><a class="lesson-link" href="vocab-shopping-numbers.html">← 第二批最后一课</a><a class="lesson-link" href="../index.html#vocabulary">返回单词课程 →</a></nav></main><footer>Cincai Learn Learn · 随便学一点，慢慢会多一点。</footer><script>const allItems=[{"term":"おはよう","romaji":"ohayou","meaning":"早安"},{"term":"こんにちは","romaji":"konnichiwa","meaning":"你好"},{"term":"こんばんは","romaji":"konbanwa","meaning":"晚上好"},{"term":"ありがとう","romaji":"arigatou","meaning":"谢谢"},{"term":"すみません","romaji":"sumimasen","meaning":"不好意思／对不起"},{"term":"はい","romaji":"hai","meaning":"是／好的"},{"term":"いいえ","romaji":"iie","meaning":"不是／不用"},{"term":"さようなら","romaji":"sayounara","meaning":"再见"},{"term":"わたし","romaji":"watashi","meaning":"我"},{"term":"あなた","romaji":"anata","meaning":"你"},{"term":"ともだち","romaji":"tomodachi","meaning":"朋友"},{"term":"かぞく","romaji":"kazoku","meaning":"家庭／家人"},{"term":"おかあさん","romaji":"okaasan","meaning":"妈妈／母亲"},{"term":"おとうさん","romaji":"otousan","meaning":"爸爸／父亲"},{"term":"せんせい","romaji":"sensei","meaning":"老师"},{"term":"がくせい","romaji":"gakusei","meaning":"学生"},{"term":"みず","romaji":"mizu","meaning":"水"},{"term":"おちゃ","romaji":"ocha","meaning":"茶"},{"term":"ごはん","romaji":"gohan","meaning":"米饭／一餐"},{"term":"パン","romaji":"pan","meaning":"面包"},{"term":"コーヒー","romaji":"koohii","meaning":"咖啡"},{"term":"たまご","romaji":"tamago","meaning":"鸡蛋"},{"term":"さかな","romaji":"sakana","meaning":"鱼"},{"term":"くだもの","romaji":"kudamono","meaning":"水果"},{"term":"いえ","romaji":"ie","meaning":"家"},{"term":"えき","romaji":"eki","meaning":"车站"},{"term":"がっこう","romaji":"gakkou","meaning":"学校"},{"term":"みせ","romaji":"mise","meaning":"商店"},{"term":"びょういん","romaji":"byouin","meaning":"医院"},{"term":"トイレ","romaji":"toire","meaning":"厕所"},{"term":"でんしゃ","romaji":"densha","meaning":"电车"},{"term":"タクシー","romaji":"takushii","meaning":"出租车"},{"term":"ほん","romaji":"hon","meaning":"书"},{"term":"かばん","romaji":"kaban","meaning":"包"},{"term":"でんわ","romaji":"denwa","meaning":"电话"},{"term":"かぎ","romaji":"kagi","meaning":"钥匙"},{"term":"くるま","romaji":"kuruma","meaning":"汽车"},{"term":"きょう","romaji":"kyou","meaning":"今天"},{"term":"あした","romaji":"ashita","meaning":"明天"},{"term":"いま","romaji":"ima","meaning":"现在"},{"term":"たべる","romaji":"taberu","meaning":"吃"},{"term":"のむ","romaji":"nomu","meaning":"喝"},{"term":"みる","romaji":"miru","meaning":"看"},{"term":"きく","romaji":"kiku","meaning":"听／问"},{"term":"はなす","romaji":"hanasu","meaning":"说／交谈"},{"term":"よむ","romaji":"yomu","meaning":"读／阅读"},{"term":"かく","romaji":"kaku","meaning":"写"},{"term":"いく","romaji":"iku","meaning":"去"},{"term":"くる","romaji":"kuru","meaning":"来"},{"term":"する","romaji":"suru","meaning":"做"},{"term":"おきる","romaji":"okiru","meaning":"起床"},{"term":"ねる","romaji":"neru","meaning":"睡觉"},{"term":"はたらく","romaji":"hataraku","meaning":"工作"},{"term":"やすむ","romaji":"yasumu","meaning":"休息／请假"},{"term":"かう","romaji":"kau","meaning":"买"},{"term":"つかう","romaji":"tsukau","meaning":"使用"},{"term":"あける","romaji":"akeru","meaning":"打开"},{"term":"しめる","romaji":"shimeru","meaning":"关闭"},{"term":"まつ","romaji":"matsu","meaning":"等待"},{"term":"あるく","romaji":"aruku","meaning":"走路"},{"term":"おおきい","romaji":"ookii","meaning":"大的"},{"term":"ちいさい","romaji":"chiisai","meaning":"小的"},{"term":"あたらしい","romaji":"atarashii","meaning":"新的"},{"term":"ふるい","romaji":"furui","meaning":"旧的／古老的"},{"term":"たかい","romaji":"takai","meaning":"贵的／高的"},{"term":"やすい","romaji":"yasui","meaning":"便宜的"},{"term":"あつい","romaji":"atsui","meaning":"热的"},{"term":"さむい","romaji":"samui","meaning":"冷的"},{"term":"おいしい","romaji":"oishii","meaning":"好吃的"},{"term":"いそがしい","romaji":"isogashii","meaning":"忙的"},{"term":"おにいさん","romaji":"oniisan","meaning":"哥哥／别人的哥哥"},{"term":"おねえさん","romaji":"oneesan","meaning":"姐姐／别人的姐姐"},{"term":"おとうと","romaji":"otouto","meaning":"弟弟"},{"term":"いもうと","romaji":"imouto","meaning":"妹妹"},{"term":"あたま","romaji":"atama","meaning":"头"},{"term":"め","romaji":"me","meaning":"眼睛"},{"term":"て","romaji":"te","meaning":"手"},{"term":"あし","romaji":"ashi","meaning":"脚／腿"},{"term":"おなか","romaji":"onaka","meaning":"肚子"},{"term":"いたい","romaji":"itai","meaning":"痛／疼"},{"term":"てんき","romaji":"tenki","meaning":"天气"},{"term":"あめ","romaji":"ame","meaning":"雨"},{"term":"ゆき","romaji":"yuki","meaning":"雪"},{"term":"かぜ","romaji":"kaze","meaning":"风"},{"term":"はれ","romaji":"hare","meaning":"晴天"},{"term":"あか","romaji":"aka","meaning":"红色"},{"term":"あお","romaji":"ao","meaning":"蓝色"},{"term":"しろ","romaji":"shiro","meaning":"白色"},{"term":"くろ","romaji":"kuro","meaning":"黑色"},{"term":"みどり","romaji":"midori","meaning":"绿色"},{"term":"ひとつ","romaji":"hitotsu","meaning":"一个"},{"term":"ふたつ","romaji":"futatsu","meaning":"两个"},{"term":"みっつ","romaji":"mittsu","meaning":"三个"},{"term":"よっつ","romaji":"yottsu","meaning":"四个"},{"term":"いつつ","romaji":"itsutsu","meaning":"五个"},{"term":"いくら","romaji":"ikura","meaning":"多少钱"},{"term":"えん","romaji":"en","meaning":"日元"},{"term":"おかね","romaji":"okane","meaning":"钱"},{"term":"これ","romaji":"kore","meaning":"这个"},{"term":"ください","romaji":"kudasai","meaning":"请给我"}];let questions=[],currentQuestion=0,score=0,answered=false;function speakJapanese(text){if(!('speechSynthesis' in window)){alert('这个浏览器暂时不支持语音播放。');return}speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(text);voice.lang='ja-JP';voice.rate=.72;voice.pitch=1;speechSynthesis.speak(voice)}function playCorrectSound(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx();const now=ctx.currentTime;[[659.25,0],[783.99,.1],[987.77,.2]].forEach(([frequency,delay])=>{const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,now+delay);gain.gain.exponentialRampToValueAtTime(.16,now+delay+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.16);oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start(now+delay);oscillator.stop(now+delay+.18)});setTimeout(()=>ctx.close(),550)}catch(error){}}function shuffle(list){const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}function buildRound(){questions=shuffle(allItems).slice(0,20).map((item,index)=>({item,mode:['reading','meaning','japanese','audio'][index%4]}));currentQuestion=0;score=0}function answerKey(q){return q.mode==='reading'?'romaji':q.mode==='meaning'?'meaning':'term'}function getOptions(q){const key=answerKey(q),correct=q.item[key],others=shuffle(allItems.filter(x=>x[key]!==correct)).slice(0,3).map(x=>x[key]);return shuffle([correct,...others])}function showQuestion(){answered=false;const q=questions[currentQuestion],key=answerKey(q),prompt=document.getElementById('prompt');document.getElementById('quizProgress').textContent='第 '+(currentQuestion+1)+' 题，共 '+questions.length+' 题';const labels={reading:'日语 → 读音',meaning:'日语 → 中文',japanese:'中文 → 日语',audio:'听发音 → 日语'};document.getElementById('modeLabel').textContent=labels[q.mode];if(q.mode==='audio'){prompt.innerHTML='<button class="sound-button" type="button" onclick="speakJapanese(questions[currentQuestion].item.term)">🔊 再听一次</button>';setTimeout(()=>speakJapanese(q.item.term),150)}else{prompt.textContent=q.mode==='japanese'?q.item.meaning:q.item.term}document.getElementById('questionText').textContent=q.mode==='reading'?'这个词怎样读？':q.mode==='meaning'?'这个词是什么意思？':q.mode==='japanese'?'选择正确的日语词':'刚才读的是哪一个词？';const options=document.getElementById('options');options.innerHTML='';getOptions(q).forEach(value=>{const button=document.createElement('button');button.className='option-button';button.type='button';button.textContent=value;button.onclick=()=>checkAnswer(button,value,key);options.appendChild(button)});document.getElementById('feedback').textContent='';document.getElementById('nextButton').style.display='none'}function checkAnswer(selectedButton,value,key){if(answered)return;answered=true;const correct=questions[currentQuestion].item[key];document.querySelectorAll('.option-button').forEach(button=>{button.disabled=true;if(button.textContent===correct)button.classList.add('correct')});const feedback=document.getElementById('feedback');if(value===correct){score++;playCorrectSound();feedback.textContent='答对了！100词越来越熟啦 🌱'}else{selectedButton.classList.add('wrong');feedback.textContent='正确答案是 '+correct+'。'}document.getElementById('nextButton').style.display='block'}function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){showQuestion();return}document.querySelector('.quiz-section').innerHTML='<div style="font-size:74px">🌿</div><h2>完成100词总复习！</h2><p style="font-size:18px;line-height:1.7">你答对了 <strong>'+score+'</strong> / '+questions.length+' 题。</p><div class="result-actions"><button class="result-link" type="button" onclick="location.reload()">重新随机20题</button><a class="result-link primary" href="../index.html#vocabulary">返回单词课程 →</a></div>'}buildRound();showQuestion();</script></body></html>
