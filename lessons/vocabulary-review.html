    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:radial-gradient(circle at 8% 12%,#fff0b8 0 65px,transparent 67px),radial-gradient(circle at 92% 32%,#d8eef7 0 80px,transparent 82px),var(--cream);font-family:"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}.site-header{width:min(1080px,92%);margin:auto;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{display:flex;align-items:center;gap:10px;color:var(--dark);font-size:22px;font-weight:850}.logo-icon{width:44px;height:44px;display:grid;place-items:center;background:var(--light);border:2px solid var(--green);border-radius:50%;font-size:24px}.home-link,.lesson-link,.result-link{padding:10px 16px;background:var(--white);border:2px solid var(--dark);border-radius:999px;font-weight:800;transition:.18s}.home-link:hover,.lesson-link:hover,.result-link:hover{transform:translateY(-2px);background:var(--light)}main{width:min(1080px,92%);margin:26px auto 78px}.progress-wrap{margin-bottom:28px}.progress-text{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--dark);font-size:14px;font-weight:800}.progress-track{height:10px;overflow:hidden;background:#e8eadf;border-radius:999px}.progress-bar{height:100%;background:linear-gradient(90deg,var(--green),#83be91);border-radius:inherit}.lesson-heading{max-width:760px;margin-bottom:34px}.lesson-label{display:inline-block;margin-bottom:14px;padding:7px 13px;background:var(--yellow);border-radius:999px;font-size:14px;font-weight:850}h1{margin:0;color:var(--dark);font-size:clamp(40px,7vw,66px);line-height:1.12}.lesson-intro{margin:16px 0 0;font-size:18px;line-height:1.8}.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.kana-grid.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:720px;margin:auto}.kana-card{padding:24px 15px 19px;text-align:center;background:var(--white);border:2px solid var(--dark);border-radius:24px;box-shadow:6px 6px 0 var(--blue);transition:.2s}.kana-card:nth-child(even){box-shadow:6px 6px 0 var(--pink)}.kana-card:hover{transform:translateY(-5px)}.kana{display:block;color:var(--dark);font-size:64px;font-weight:850;line-height:1.18}.romaji{display:block;margin:7px 0;color:var(--green);font-size:20px;font-weight:850}.example{min-height:49px;margin:0 0 14px;font-size:14px;line-height:1.5}.example strong{color:var(--dark)}.sound-button{width:100%;padding:10px;color:var(--dark);background:var(--light);border:0;border-radius:13px;cursor:pointer;font-weight:800}.sound-button:hover{background:var(--yellow)}.tip{margin:38px 0 58px;padding:20px 24px;background:var(--light);border-left:6px solid var(--green);border-radius:0 18px 18px 0;line-height:1.75}.quiz-section{max-width:740px;margin:auto;padding:34px;text-align:center;background:var(--white);border:3px solid var(--dark);border-radius:30px;box-shadow:10px 10px 0 var(--yellow)}.quiz-section h2{margin:0 0 12px;color:var(--dark);font-size:30px}.quiz-progress{color:var(--green);font-weight:800}.quiz-kana{margin:15px 0;color:var(--dark);font-size:88px;font-weight:900;line-height:1.15}.question-text{font-size:17px;font-weight:750}.options{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}.option-button{padding:13px 8px;color:var(--dark);background:var(--cream);border:2px solid var(--green);border-radius:14px;cursor:pointer;font-weight:850;transition:.15s}.option-button:hover:not(:disabled){transform:translateY(-2px);background:var(--light)}.option-button:disabled{cursor:default}.option-button.correct{background:var(--correct);border-color:var(--dark)}.option-button.wrong{background:var(--wrong);border-color:#c86d62}.feedback{min-height:30px;margin:20px 0 9px;font-size:17px;font-weight:850}.next-question{display:none;margin:auto;padding:12px 22px;color:var(--white);background:var(--dark);border:0;border-radius:14px;cursor:pointer;font-weight:850 .study-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.study-card{padding:22px 16px;background:var(--white);border:2px solid var(--dark);border-radius:22px;box-shadow:5px 5px 0 var(--blue);text-align:center}.study-card:nth-child(even){box-shadow-color:var(--pink)}.study-term{display:block;color:var(--dark);font-size:clamp(27px,4vw,38px);font-weight:900;line-height:1.25}.study-romaji{display:block;margin:8px 0;color:var(--green);font-weight:850}.study-meaning{min-height:46px;margin:0 0 8px;line-height:1.45;font-weight:750}.study-note{min-height:38px;margin:0 0 13px;color:#666;font-size:13px;line-height:1.4}.rule-box{margin:0 0 28px;padding:19px 22px;background:var(--light);border:2px dashed var(--green);border-radius:19px;line-height:1.75}.review-badge{display:inline-block;margin-bottom:12px;padding:7px 13px;background:var(--yellow);border-radius:999px;font-weight:850}.review-intro{max-width:760px;margin-bottom:32px}.review-intro h1{margin-bottom:16px}.review-intro p{font-size:18px;line-height:1.75}.mode-label{margin:12px 0;color:var(--green);font-weight:850}.review-prompt{margin:13px 0;color:var(--dark);font-size:clamp(40px,8vw,68px);font-weight:900;line-height:1.2}.review-options{grid-template-columns:repeat(2,1fr)}@media(max-width:900px){.study-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.study-grid,.review-options{grid-template-columns:1fr}.study-meaning,.study-note{min-height:0}}</style></head><body><header class="site-header"><a class="logo" href="../index.html"><span class="logo-icon">🌱</span><span>Cincai Learn Learn</span></a><a class="home-link" href="../index.html#practice">练习目录</a></header><main><section class="review-intro"><span class="review-badge">40个常用词 · 随机15题</span><h1>第一批40个常用单词总复习</h1><p>复习问候、人物、食物、地点交通和日常用品。每轮随机抽出15题，交替练习读音和中文意思。🌱</p></section><section class="quiz-section"><h2>准备好了吗？</h2><div class="quiz-progress" id="quizProgress"></div><div class="mode-label" id="modeLabel"></div><div class="review-prompt" id="prompt"></div><div class="question-text" id="questionText"></div><div class="options review-options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next-question" id="nextButton" type="button" onclick="nextQuestion()">下一题 →</button></section><nav class="lesson-navigation"><a class="lesson-link" href="../index.html#practice">← 返回练习目录</a><a class="lesson-link" href="../index.html#vocabulary">返回单词课程 →</a></nav></main><footer>Cincai Learn Learn · 随便学一点，慢慢会多一点。</footer><script>const allItems=[{"term":"おはよう","romaji":"ohayou","meaning":"早安"},{"term":"こんにちは","romaji":"konnichiwa","meaning":"你好"},{"term":"こんばんは","romaji":"konbanwa","meaning":"晚上好"},{"term":"ありがとう","romaji":"arigatou","meaning":"谢谢"},{"term":"すみません","romaji":"sumimasen","meaning":"不好意思／对不起"},{"term":"はい","romaji":"hai","meaning":"是／好的"},{"term":"いいえ","romaji":"iie","meaning":"不是／不用"},{"term":"さようなら","romaji":"sayounara","meaning":"再见"},{"term":"わたし","romaji":"watashi","meaning":"我"},{"term":"あなた","romaji":"anata","meaning":"你"},{"term":"ともだち","romaji":"tomodachi","meaning":"朋友"},{"term":"かぞく","romaji":"kazoku","meaning":"家庭／家人"},{"term":"おかあさん","romaji":"okaasan","meaning":"妈妈／母亲"},{"term":"おとうさん","romaji":"otousan","meaning":"爸爸／父亲"},{"term":"せんせい","romaji":"sensei","meaning":"老师"},{"term":"がくせい","romaji":"gakusei","meaning":"学生"},{"term":"みず","romaji":"mizu","meaning":"水"},{"term":"おちゃ","romaji":"ocha","meaning":"茶"},{"term":"ごはん","romaji":"gohan","meaning":"米饭／一餐"},{"term":"パン","romaji":"pan","meaning":"面包"},{"term":"コーヒー","romaji":"koohii","meaning":"咖啡"},{"term":"たまご","romaji":"tamago","meaning":"鸡蛋"},{"term":"さかな","romaji":"sakana","meaning":"鱼"},{"term":"くだもの","romaji":"kudamono","meaning":"水果"},{"term":"いえ","romaji":"ie","meaning":"家"},{"term":"えき","romaji":"eki","meaning":"车站"},{"term":"がっこう","romaji":"gakkou","meaning":"学校"},{"term":"みせ","romaji":"mise","meaning":"商店"},{"term":"びょういん","romaji":"byouin","meaning":"医院"},{"term":"トイレ","romaji":"toire","meaning":"厕所"},{"term":"でんしゃ","romaji":"densha","meaning":"电车"},{"term":"タクシー","romaji":"takushii","meaning":"出租车"},{"term":"ほん","romaji":"hon","meaning":"书"},{"term":"かばん","romaji":"kaban","meaning":"包"},{"term":"でんわ","romaji":"denwa","meaning":"电话"},{"term":"かぎ","romaji":"kagi","meaning":"钥匙"},{"term":"くるま","romaji":"kuruma","meaning":"汽车"},{"term":"きょう","romaji":"kyou","meaning":"今天"},{"term":"あした","romaji":"ashita","meaning":"明天"},{"term":"いま","romaji":"ima","meaning":"现在"}];let questions=[],currentQuestion=0,score=0,answered=false;function playCorrectSound(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx();const now=ctx.currentTime;[[659.25,0],[783.99,.1],[987.77,.2]].forEach(([frequency,delay])=>{const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,now+delay);gain.gain.exponentialRampToValueAtTime(.16,now+delay+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.16);oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start(now+delay);oscillator.stop(now+delay+.18)});setTimeout(()=>ctx.close(),550)}catch(error){}}function shuffle(list){const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}function buildRound(){questions=shuffle(allItems).slice(0,15).map((item,index)=>({item,mode:index%2===0?'reading':'meaning'}));currentQuestion=0;score=0}function getOptions(q){const key=q.mode==='reading'?'romaji':'meaning',correct=q.item[key],others=shuffle(allItems.filter(x=>x[key]!==correct)).slice(0,3).map(x=>x[key]);return shuffle([correct,...others])}function showQuestion(){answered=false;const q=questions[currentQuestion];document.getElementById('quizProgress').textContent='第 '+(currentQuestion+1)+' 题，共 '+questions.length+' 题';document.getElementById('modeLabel').textContent=q.mode==='reading'?'选择正确读音':'选择中文意思';document.getElementById('prompt').textContent=q.item.term;document.getElementById('questionText').textContent=q.mode==='reading'?'这个词怎样读？':'这个词是什么意思？';const options=document.getElementById('options');options.innerHTML='';getOptions(q).forEach(value=>{const button=document.createElement('button');button.className='option-button';button.type='button';button.textContent=value;button.onclick=()=>checkAnswer(button,value);options.appendChild(button)});document.getElementById('feedback').textContent='';document.getElementById('nextButton').style.display='none'}function checkAnswer(selectedButton,value){if(answered)return;answered=true;const q=questions[currentQuestion],key=q.mode==='reading'?'romaji':'meaning',correct=q.item[key];document.querySelectorAll('.option-button').forEach(button=>{button.disabled=true;if(button.textContent===correct)button.classList.add('correct')});const feedback=document.getElementById('feedback');if(value===correct){score++;playCorrectSound();feedback.textContent='答对了！继续发芽 🌱'}else{selectedButton.classList.add('wrong');feedback.textContent='正确答案是 '+correct+'。'}document.getElementById('nextButton').style.display='block'}function nextQuestion(){currentQuestion++;if(currentQuestion<questions.length){showQuestion();return}showResult()}function showResult(){document.querySelector('.quiz-section').innerHTML='<div style="font-size:74px">🌿</div><h2>完成这一轮！</h2><p style="font-size:18px;line-height:1.7">你答对了 <strong>'+score+'</strong> / '+questions.length+' 题。</p><div class="result-actions"><button class="result-link" type="button" onclick="location.reload()">重新随机15题</button><a class="result-link primary" href="../index.html#vocabulary">返回单词课程 →</a></div>'}buildRound();showQuestion();</script></body></html>
