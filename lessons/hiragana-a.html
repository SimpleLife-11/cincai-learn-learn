<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>平假名「あ行」学习｜Cincai Learn Learn</title>

  <meta
    name="description"
    content="零基础学习日语平假名「あ、い、う、え、お」，包含罗马音、日语发音和互动小测验。"
  >

  <style>
    :root {
      --green: #5e9f76;
      --dark-green: #37634b;
      --light-green: #dff1df;
      --cream: #fffaf0;
      --yellow: #ffd978;
      --pink: #f5b5ad;
      --blue: #addbea;
      --text: #33413a;
      --white: #ffffff;
      --correct: #d9f2df;
      --wrong: #ffe0dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, #fff0b8 0 65px, transparent 67px),
        radial-gradient(circle at 92% 32%, #d8eef7 0 80px, transparent 82px),
        var(--cream);
      font-family:
        "Segoe UI",
        "Noto Sans SC",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      width: min(1050px, 92%);
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dark-green);
      font-size: 23px;
      font-weight: 800;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--light-green);
      border: 2px solid var(--green);
      border-radius: 50%;
      font-size: 24px;
    }

    .back-link {
      padding: 10px 17px;
      background: var(--white);
      border: 2px solid var(--dark-green);
      border-radius: 999px;
      font-weight: 750;
    }

    main {
      width: min(1050px, 92%);
      margin: 30px auto 80px;
    }

    .lesson-heading {
      max-width: 720px;
      margin-bottom: 38px;
    }

    .lesson-label {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 13px;
      background: var(--yellow);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: var(--dark-green);
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.15;
    }

    .lesson-intro {
      margin-top: 18px;
      font-size: 17px;
      line-height: 1.8;
    }

    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .kana-card {
      padding: 26px 16px 20px;
      text-align: center;
      background: var(--white);
      border: 2px solid var(--dark-green);
      border-radius: 25px;
      box-shadow: 6px 6px 0 var(--blue);
      transition: 0.2s ease;
    }

    .kana-card:nth-child(even) {
      box-shadow: 6px 6px 0 var(--pink);
    }

    .kana-card:hover {
      transform: translateY(-5px);
    }

    .kana {
      display: block;
      color: var(--dark-green);
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
    }

    .romaji {
      display: block;
      margin: 8px 0 17px;
      color: var(--green);
      font-size: 20px;
      font-weight: 800;
    }

    .sound-button {
      width: 100%;
      padding: 10px;
      color: var(--dark-green);
      background: var(--light-green);
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 750;
    }

    .sound-button:hover {
      background: var(--yellow);
    }

    .tip {
      margin: 38px 0 60px;
      padding: 20px 24px;
      background: var(--light-green);
      border-left: 6px solid var(--green);
      border-radius: 0 18px 18px 0;
      line-height: 1.7;
    }

    .quiz-section {
      max-width: 720px;
      margin: 0 auto;
      padding: 35px;
      text-align: center;
      background: var(--white);
      border: 3px solid var(--dark-green);
      border-radius: 32px;
      box-shadow: 10px 10px 0 var(--yellow);
    }

    .quiz-section h2 {
      margin-top: 0;
      color: var(--dark-green);
      font-size: 30px;
    }

    .quiz-progress {
      color: var(--green);
      font-weight: 750;
    }

    .quiz-kana {
      margin: 18px 0;
      color: var(--dark-green);
      font-size: 88px;
      font-weight: 850;
      line-height: 1.2;
    }

    .question-text {
      font-size: 17px;
      font-weight: 700;
    }

    .options {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .option-button {
      padding: 13px 8px;
      color: var(--dark-green);
      background: var(--cream);
      border: 2px solid var(--green);
      border-radius: 14px;
      cursor: pointer;
      font-weight: 850;
      transition: 0.15s ease;
    }

    .option-button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: var(--light-green);
    }

    .option-button:disabled {
      cursor: default;
    }

    .option-button.correct {
      background: var(--correct);
      border-color: var(--dark-green);
    }

    .option-button.wrong {
      background: var(--wrong);
      border-color: #c86d62;
    }

    .feedback {
      min-height: 30px;
      margin: 22px 0 10px;
      font-size: 17px;
      font-weight: 800;
    }

    .next-button {
      display: none;
      margin: 0 auto;
      padding: 12px 22px;
      color: var(--white);
      background: var(--dark-green);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
    }

    footer {
      padding: 26px;
      text-align: center;
      color: var(--dark-green);
      background: var(--light-green);
      font-size: 14px;
      font-weight: 650;
    }

    @media (max-width: 760px) {
      .kana-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .kana-card:last-child {
        grid-column: 1 / -1;
      }

      .options {
        grid-template-columns: repeat(2, 1fr);
      }

      .quiz-section {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="../index.html">
      <span class="logo-icon">🌱</span>
      <span>Cincai Learn Learn</span>
    </a>

    <a class="back-link" href="../index.html">← 返回首页</a>
  </header>

  <main>
    <section class="lesson-heading">
      <span class="lesson-label">平假名 · 第一课</span>

      <h1>认识「あ行」</h1>

      <p class="lesson-intro">
        「あ行」是五十音的第一组。先观察每个假名的形状，
        再点击按钮听发音。今天只需要记住五个，不用着急。
      </p>
    </section>

    <section class="kana-grid" aria-label="平假名あ行">
      <article class="kana-card">
        <span class="kana">あ</span>
        <span class="romaji">a</span>
        <button class="sound-button" onclick="speakKana('あ')">
          🔊 听发音
        </button>
      </article>

      <article class="kana-card">
        <span class="kana">い</span>
        <span class="romaji">i</span>
        <button class="sound-button" onclick="speakKana('い')">
          🔊 听发音
        </button>
      </article>

      <article class="kana-card">
        <span class="kana">う</span>
        <span class="romaji">u</span>
        <button class="sound-button" onclick="speakKana('う')">
          🔊 听发音
        </button>
      </article>

      <article class="kana-card">
        <span class="kana">え</span>
        <span class="romaji">e</span>
        <button class="sound-button" onclick="speakKana('え')">
          🔊 听发音
        </button>
      </article>

      <article class="kana-card">
        <span class="kana">お</span>
        <span class="romaji">o</span>
        <button class="sound-button" onclick="speakKana('お')">
          🔊 听发音
        </button>
      </article>
    </section>

    <aside class="tip">
      🌱 <strong>学习提示：</strong>
      罗马音是帮助初学者认识发音的工具。学习时也要多看假名，
      不要只记住英文字母。
    </aside>

    <section class="quiz-section">
      <h2>来试试看吧</h2>

      <div class="quiz-progress" id="quizProgress">第 1 题，共 5 题</div>

      <div class="quiz-kana" id="quizKana">あ</div>

      <div class="question-text">这个假名的罗马音是什么？</div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <button class="next-button" id="nextButton" onclick="nextQuestion()">
        下一题 →
      </button>
    </section>
  </main>

  <footer>
    Cincai Learn Learn · 每天一小步，让日语慢慢发芽。
  </footer>

  <script>
    const kanaList = [
      { kana: "あ", romaji: "a" },
      { kana: "い", romaji: "i" },
      { kana: "う", romaji: "u" },
      { kana: "え", romaji: "e" },
      { kana: "お", romaji: "o" }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function speakKana(kana) {
      if (!("speechSynthesis" in window)) {
        alert("这个浏览器暂时不支持语音播放。");
        return;
      }

      window.speechSynthesis.cancel();

      const voice = new SpeechSynthesisUtterance(kana);
      voice.lang = "ja-JP";
      voice.rate = 0.75;
      voice.pitch = 1;

      window.speechSynthesis.speak(voice);
    }

    function showQuestion() {
      answered = false;

      const question = kanaList[currentQuestion];
      const options = document.getElementById("options");
      const feedback = document.getElementById("feedback");
      const nextButton = document.getElementById("nextButton");

      document.getElementById("quizProgress").textContent =
        `第 ${currentQuestion + 1} 题，共 ${kanaList.length} 题`;

      document.getElementById("quizKana").textContent = question.kana;

      feedback.textContent = "";
      nextButton.style.display = "none";
      options.innerHTML = "";

      kanaList.forEach((item) => {
        const button = document.createElement("button");

        button.className = "option-button";
        button.textContent = item.romaji;
        button.onclick = () => checkAnswer(button, item.romaji);

        options.appendChild(button);
      });
    }

    function checkAnswer(selectedButton, selectedAnswer) {
      if (answered) return;

      answered = true;

      const correctAnswer = kanaList[currentQuestion].romaji;
      const buttons = document.querySelectorAll(".option-button");
      const feedback = document.getElementById("feedback");

      buttons.forEach((button) => {
        button.disabled = true;

        if (button.textContent === correctAnswer) {
          button.classList.add("correct");
        }
      });

      if (selectedAnswer === correctAnswer) {
        score++;
        feedback.textContent = "答对了！小芽又长高一点啦 🌱";
      } else {
        selectedButton.classList.add("wrong");
        feedback.textContent =
          `差一点点！正确答案是 ${correctAnswer}。`;
      }

      document.getElementById("nextButton").style.display = "block";
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < kanaList.length) {
        showQuestion();
        return;
      }

      showResult();
    }

    function showResult() {
      const quizSection = document.querySelector(".quiz-section");

      quizSection.innerHTML = `
        <div style="font-size: 74px;">🌱</div>
        <h2>完成第一轮练习！</h2>
        <p style="font-size: 18px; line-height: 1.7;">
          你答对了 <strong>${score}</strong> / ${kanaList.length} 题。
        </p>
        <button
          class="next-button"
          style="display: block;"
          onclick="restartQuiz()"
        >
          再练习一次
        </button>
      `;
    }

    function restartQuiz() {
      window.location.reload();
    }

    showQuestion();
  </script>
</body>
</html>
